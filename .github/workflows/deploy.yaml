name: Deploy
run-name: Deploy 🚀
on:
  push:
    branches:
      - master

# Passos inline (mesmos da action mauriciofsnts/zero/.github/actions/build-push):
# este repo é público e não pode usar actions do zero, que é privado.
# A tag harbor.mrzt.dev/mrzt/itsme:<branch> é a que o ImageUpdater do cluster observa.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: harbor.mrzt.dev
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          push: true
          tags: harbor.mrzt.dev/mrzt/itsme:${{ github.ref_name }}
          cache-from: type=registry,ref=harbor.mrzt.dev/mrzt/itsme:buildcache
          cache-to: type=registry,ref=harbor.mrzt.dev/mrzt/itsme:buildcache,mode=max

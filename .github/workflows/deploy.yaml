name: Deploy
run-name: Deploy 🚀
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: mauriciofsnts/zero/.github/actions/build-push@master
        with:
          image: itsme
          harbor-username: ${{ secrets.HARBOR_USERNAME }}
          harbor-password: ${{ secrets.HARBOR_PASSWORD }}
